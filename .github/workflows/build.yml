name: Build macOS (x86_64 / arm64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile for ${{ matrix.arch }}
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          APP="build/WeTypeTouchBarBridge.app"
          BIN="$APP/Contents/MacOS/WeTypeTouchBarBridge"
          mkdir -p "$APP/Contents/MacOS"

          xcrun clang -arch "$TARGET_ARCH" \
            -fobjc-arc -fmodules -mmacosx-version-min=13.0 \
            -O2 -Wall -Wextra \
            -framework Cocoa \
            -framework ApplicationServices \
            -framework Carbon \
            -framework ServiceManagement \
            main.m -o "$BIN"

          cp Info.plist "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"

      - name: Verify architecture and signature
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          APP="build/WeTypeTouchBarBridge.app"
          BIN="$APP/Contents/MacOS/WeTypeTouchBarBridge"
          lipo -info "$BIN"
          ACTUAL_ARCHS="$(lipo -archs "$BIN")"
          test "$ACTUAL_ARCHS" = "$TARGET_ARCH"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          cd build
          ditto -c -k --keepParent WeTypeTouchBarBridge.app "WeTypeTouchBarBridge-${TARGET_ARCH}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeTypeTouchBarBridge-${{ matrix.arch }}
          path: build/WeTypeTouchBarBridge-${{ matrix.arch }}.zip
          if-no-files-found: error
