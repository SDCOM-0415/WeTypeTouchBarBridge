name: Build macOS (x86_64 / arm64)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建成功后发布 GitHub Release？（默认仅构建）'
        type: boolean
        required: true
        default: false
      release_tag:
        description: '发布时填写版本标签，例如 v1.1.0；仅构建时留空'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile for ${{ matrix.arch }}
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          APP="build/WeTypeTouchBarBridge.app"
          BIN="$APP/Contents/MacOS/WeTypeTouchBarBridge"
          mkdir -p "$APP/Contents/MacOS"

          xcrun clang -arch "$TARGET_ARCH" \
            -fobjc-arc -fmodules -mmacosx-version-min=13.0 \
            -O2 -Wall -Wextra \
            -framework Cocoa \
            -framework ApplicationServices \
            -framework Carbon \
            -framework ServiceManagement \
            main.m -o "$BIN"

          cp Info.plist "$APP/Contents/Info.plist"

      - name: Import signing certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${P12_BASE64:?Missing certificate secret}"
          : "${P12_PASSWORD:?Missing certificate password}"
          : "${KEYCHAIN_PASSWORD:?Missing keychain password}"
          KEYCHAIN="$RUNNER_TEMP/wetype-signing.keychain-db"
          P12_FILE="$RUNNER_TEMP/wetype-signing.p12"
          printf '%s' "$P12_BASE64" | base64 -D > "$P12_FILE"
          chmod 600 "$P12_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$P12_FILE" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # A self-signed leaf certificate may be usable by codesign without
          # changing keychain trust settings. Log identities for diagnostics.
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -p codesigning "$KEYCHAIN"
          rm -f "$P12_FILE"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign with dedicated test identity
        shell: bash
        run: |
          set -euo pipefail
          # Match the tested local signing command by common name. A self-signed
          # identity can be omitted from the valid-only SHA-1 identity lookup.
          codesign --force --sign "WeTypeTouchBarBridge Developer" \
            --keychain "$SIGNING_KEYCHAIN" build/WeTypeTouchBarBridge.app

      - name: Verify architecture and signature
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          APP="build/WeTypeTouchBarBridge.app"
          BIN="$APP/Contents/MacOS/WeTypeTouchBarBridge"
          lipo -info "$BIN"
          ACTUAL_ARCHS="$(lipo -archs "$BIN")"
          test "$ACTUAL_ARCHS" = "$TARGET_ARCH"
          codesign --verify --deep --strict --verbose=2 "$APP"
          REQUIREMENT="$(codesign -dr - "$APP" 2>&1)"
          printf "%s\n" "$REQUIREMENT"
          [[ "$REQUIREMENT" == *'certificate root = H"f8dd3bbd25899e443aff0fa9b97a37d74b821520"'* ]]

      - name: Package
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          cd build
          ditto -c -k --keepParent WeTypeTouchBarBridge.app "WeTypeTouchBarBridge-${TARGET_ARCH}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeTypeTouchBarBridge-${{ matrix.arch }}
          path: build/WeTypeTouchBarBridge-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Cleanup signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/wetype-signing.p12"

  release:
    name: Publish Release (explicit opt-in)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Validate release tag and app version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must follow vMAJOR.MINOR.PATCH (e.g. v1.1.0)."
            exit 1
          fi
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist","rb"))["CFBundleShortVersionString"])')
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Info.plist version $VERSION."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace it."
            exit 1
          fi
          REMOTE_SHA=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag already exists at a different commit; refusing to move it."
            exit 1
          fi

      - name: Download both architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WeTypeTouchBarBridge-*
          path: release-files
          merge-multiple: true

      - name: Verify release packages
        shell: bash
        run: |
          set -euo pipefail
          for arch in x86_64 arm64; do
            zip="release-files/WeTypeTouchBarBridge-${arch}.zip"
            test -s "$zip" || { echo "::error::Missing $zip"; exit 1; }
            unzip -t "$zip" >/dev/null
            if ! unzip -Z -1 "$zip" | grep -q '^WeTypeTouchBarBridge.app/Contents/MacOS/WeTypeTouchBarBridge$'; then
              echo "::error::Invalid app package: $zip"
              exit 1
            fi
          done
          sha256sum release-files/*.zip > release-files/SHA256SUMS

      - name: Publish verified ZIPs directly (no nested archives)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-files/WeTypeTouchBarBridge-x86_64.zip \
            release-files/WeTypeTouchBarBridge-arm64.zip \
            release-files/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
