name: Probe CNB Public Release API

on:
  push:
    paths:
      - '.github/workflows/probe-cnb-public-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe anonymous latest Release endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cnb.cool/SDCOM/WeTypeTouchBarBridge/-/releases/latest"
          status=$(curl --silent --show-error --location --max-time 15 -H 'Accept: application/vnd.cnb.api+json' -o /tmp/cnb-release.json -w '%{http_code}' "$url")
          echo "HTTP $status"
          python3 - <<'PY'
          import json
          try:
              obj=json.load(open('/tmp/cnb-release.json'))
              if isinstance(obj,dict):
                  print('fields:',sorted(obj.keys()))
                  print('tag_name:',obj.get('tag_name'))
                  print('is_latest:',obj.get('is_latest'))
                  print('assets:',[a.get('name') for a in obj.get('assets',[]) if isinstance(a,dict)])
              else:
                  print('response type:', type(obj).__name__)
          except Exception as e:
              print('Not JSON:',type(e).__name__)
          PY
          for url in \
            "https://api.cnb.cool/SDCOM/WeTypeTouchBarBridge/-/git/raw/main/README.md" \
            "https://cnb.cool/SDCOM/WeTypeTouchBarBridge/-/raw/main/README.md" \
            "https://cnb.cool/SDCOM/WeTypeTouchBarBridge/-/blob/main/README.md?raw=true" \
            "https://cnb.cool/SDCOM/WeTypeTouchBarBridge/-/badge/release" \
            "https://cnb.cool/SDCOM/WeTypeTouchBarBridge/-/releases/tag/v1.1"; do
            status=$(curl --silent --show-error --location --max-time 15 -o /tmp/cnb-probe-body -w '%{http_code}' "$url")
            echo "ANONYMOUS GET $url -> HTTP $status"
            echo "body prefix: $(head -c 350 /tmp/cnb-probe-body | tr '\n' ' ')"
            if [[ "$url" == *'/badge/release' ]]; then
              echo "SVG_TEXT_START"
              cat /tmp/cnb-probe-body
              echo
              echo "SVG_TEXT_END"
            fi
          done
          if [ "$status" != 200 ]; then
            echo "::warning::CNB public Release API returned HTTP $status"
          fi
